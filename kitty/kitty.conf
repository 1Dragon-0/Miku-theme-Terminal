# ~/.config/kitty/kitty.conf
# Behavior only. The palette lives in miku.conf.

# --- Typography ---
font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11
disable_ligatures always

# --- Window ---
remember_window_size  yes
initial_window_width  1280
initial_window_height 720
placement_strategy    center
hide_window_decorations no
wayland_titlebar_color background
confirm_os_window_close 0
window_border_width     1
draw_minimal_borders    yes
window_margin_width     0
single_window_margin_width -1
window_padding_width    1
single_window_padding_width -1
enabled_layouts *

# --- Performance ---
repaint_delay 6
input_delay   1
sync_to_monitor no
resize_debounce_time 0.05 0.05

# --- Scrollback and mouse ---
scrollback_lines 2000
copy_on_select yes
default_pointer_shape beam
pointer_shape_when_dragging beam
mouse_map middle release ungrabbed paste_from_selection

# --- Tabs ---
tab_bar_edge bottom
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_bar_style powerline
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_fade 0.25 0.5 0.75 1
tab_title_template "{num_windows} window{'s' if num_windows > 1 else ''} opened"

# --- Integration ---
# install.sh rewrites this line to the fish binary found on this system.
shell /usr/bin/fish
allow_remote_control yes

# --- Keybindings ---
clear_all_shortcuts yes
map alt+c copy_to_clipboard
map alt+v paste_from_clipboard
map alt+enter new_window
map alt+w close_window
map ctrl+tab next_window
map alt+tab previous_window
map alt+r start_resizing_window
map alt+right next_tab
map alt+left previous_tab
map alt+t new_tab
map alt+q close_tab
map alt+up move_tab_forward
map alt+down move_tab_backward
map alt+n set_tab_title
map alt+l next_layout
map alt+kp_add change_font_size all +2.0
map alt+kp_subtract change_font_size all -2.0
map alt+backspace change_font_size all 0
map alt+f5 load_config_file

# --- Theme ---
include miku.conf
