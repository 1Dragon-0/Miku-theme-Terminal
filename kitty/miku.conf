# Miku night palette — night-blue background, teal lead, pink accent.

background #0B1220
foreground #C9D6E3
background_opacity 0.88

# Cursor
cursor            #39C5BB
cursor_text_color #0B1220
cursor_shape beam
cursor_underline_thickness 2
cursor_blink_interval -1
cursor_stop_blinking_after 15

# Selection and links
selection_foreground #EAF3F8
selection_background #1E5A5C
url_color            #6FE0D6

# Window borders
active_border_color   #39C5BB
inactive_border_color #22324A
bell_border_color     #E12885

# Tabs
tab_bar_background     #0B1220
active_tab_foreground   #0B1220
active_tab_background   #39C5BB
inactive_tab_foreground #7A8CA0
inactive_tab_background #111C2B

# Marks
mark1_foreground #0B1220
mark1_background #39C5BB
mark2_foreground #0B1220
mark2_background #E12885
mark3_foreground #0B1220
mark3_background #5AA9E6

# ANSI
color0  #1A2433
color8  #4A5A6E
